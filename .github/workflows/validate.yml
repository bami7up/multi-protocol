name: Validate templates and installer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Тег закреплён по SHA: переезд или подмена тега upstream'ом не изменит
        # то, что выполняется в сборке (fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 = v5).
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq
          # Версии печатаются в лог: правила shellcheck меняются между
          # выпусками (например, SC2317 переименован в SC2329 в 0.11), и при
          # разборе падения важно знать, чем именно проверяли.
          shellcheck --version | sed -n '/version:/p'
          jq --version

      - name: Validate installer
        run: |
          bash -n remnanode-setup.sh
          shellcheck -x remnanode-setup.sh
          bash -n tests/caddy-http-checks.sh
          shellcheck -x tests/caddy-http-checks.sh
          bash -n tests/installer-funcs-checks.sh
          shellcheck -x tests/installer-funcs-checks.sh
          bash -n tests/env-flags-checks.sh
          shellcheck -x tests/env-flags-checks.sh

      - name: Unit-test installer validation functions
        run: bash tests/installer-funcs-checks.sh

      - name: Unit-test installer env flags and step 1 checks
        run: bash tests/env-flags-checks.sh

      - name: Validate JSON5 templates
        run: |
          npx --yes json5@2.2.3 -s 2 Multiselect.json > /tmp/multiselect.json
          npx --yes json5@2.2.3 -s 2 Xray_template.json > /tmp/xray-template.json
          npx --yes json5@2.2.3 -s 2 Xray_template_split.json > /tmp/xray-template-split.json
          jq -e . /tmp/multiselect.json /tmp/xray-template.json /tmp/xray-template-split.json >/dev/null
          jq -e '
            [.inbounds[].tag] == [
              "REALITY_VISION", "REALITY_XHTTP", "HYSTERIA2",
              "VLESS_CDN_WS", "VLESS_CDN_XHTTP", "VLESS_CDN_GRPC"
            ] and
            (.inbounds[0].listen == "127.0.0.1") and
            (.inbounds[0].port == 10443) and
            (.inbounds[0].streamSettings.realitySettings.minClientVer == "0.0.0") and
            (.inbounds[0].streamSettings.realitySettings.target == "127.0.0.1:9443") and
            (.inbounds[1].listen == "127.0.0.1") and
            (.inbounds[1].port == 10444) and
            (.inbounds[1].streamSettings.realitySettings.minClientVer == "0.0.0") and
            (.inbounds[2].listen == "0.0.0.0") and
            (.inbounds[2].port == 443) and
            # CDN-инбаунды: только loopback и без собственного TLS — публичный
            # TLS терминируют CDN и Caddy, Xray наружу не смотрит.
            ([.inbounds[3,4,5].listen] == ["127.0.0.1", "127.0.0.1", "127.0.0.1"]) and
            ([.inbounds[3,4,5].port] == [10446, 10447, 10448]) and
            ([.inbounds[3,4,5].streamSettings.security] | all(. == "none")) and
            (.inbounds[3].streamSettings.network == "ws") and
            (.inbounds[3].streamSettings.wsSettings.path == "/api/v1/stream") and
            (.inbounds[4].streamSettings.network == "xhttp") and
            (.inbounds[5].streamSettings.network == "grpc") and
            (.inbounds[5].streamSettings.grpcSettings.serviceName == "/api/v4/stream")
          ' /tmp/multiselect.json >/dev/null
          jq -e '
            (.remnawave.injectHosts[0].selector.type == "tagRegex") and
            (.remnawave.injectHosts[0].selectFrom == "HIDDEN") and
            (.remnawave.injectHosts[0].tagPrefix == "proxy") and
            (.dns.servers == ["94.140.14.14", "94.140.15.15"]) and
            (.routing.balancers[0].selector == ["proxy"]) and
            (.burstObservatory.subjectSelector == ["proxy"])
          ' /tmp/xray-template.json >/dev/null
          jq -e '
            (.remnawave.injectHosts[0].selector.pattern == "^USA$") and
            (.dns.servers == ["94.140.14.14", "94.140.15.15"]) and
            ([.. | strings] | any(. == "geosite:category-ads-all") | not) and
            (.routing.rules | map(select(.ruleTag == "BITTORRENT_BLOCK" and .protocol == ["bittorrent"] and .outboundTag == "block")) | length == 1) and
            (.routing.rules | map(select(.ruleTag == "ADGUARD_DNS_PROXY" and .ip == ["94.140.14.14", "94.140.15.15"] and .port == "53" and .balancerTag == "USA")) | length == 1) and
            (.routing.rules | map(select(.ruleTag == "SERVICE_IP_PROXY" and (.ip | length > 100) and .balancerTag == "USA")) | length == 1) and
            (.routing.rules | map(select(.ruleTag == "RU_SPLIT_PROXY" and (.domain | length > 1200) and .balancerTag == "USA")) | length == 1) and
            (.routing.rules[-1].ruleTag == "DEFAULT_DIRECT") and
            (.routing.rules[-1].network == "tcp,udp") and
            (.routing.rules[-1].outboundTag == "direct")
          ' /tmp/xray-template-split.json >/dev/null

      - name: Validate facade JavaScript
        run: |
          # Каждая тема фасада — самостоятельный файл со своим инлайновым скриптом.
          for f in self-steal-templates/*.html; do
            sed -n '/<script>/,/<\/script>/p' "$f" | sed '1d;$d' > /tmp/facade.js
            node --check /tmp/facade.js || { echo "✖ $f: скрипт не проходит node --check" >&2; exit 1; }
          done
          echo "✔ скрипты всех тем self-steal валидны"

      - name: Integration-test the generated Caddyfile on a real Caddy
        run: bash tests/caddy-http-checks.sh

      - name: Check whitespace
        run: "! git grep -nI -E '[[:blank:]]+$' -- '*.sh' '*.json' '*.md' '*.html' '*.yml'"

      - name: Guard fixed invariants
        run: |
          # Проверки на баги, которые уже были исправлены: пусть регресс ломает CI.
          # Каждая проверка завершает шаг сама, потому что `! cmd` под `set -e` не прерывает скрипт.
          set -euo pipefail
          fail() { echo "✖ $1" >&2; exit 1; }
          # Этот файл исключён из поиска: строки ниже сами содержат искомые литералы.
          WF=':!.github/workflows/validate.yml'

          # 1. Никаких следов удалённого Trojan TLS и его порта.
          if git grep -nI -E '10445|Trojan|trojan' -- '*.sh' '*.json' '*.md' '*.html' "$WF"; then
            fail "в репозитории остались следы Trojan/10445 (см. вывод выше)"
          fi

          # 2. На :80 — постоянный 301 с сохранением URI, а не respond-заглушка.
          grep -q 'redir https://$SELF_STEAL_HOST{uri} permanent' remnanode-setup.sh \
            || fail "на :80 нет 'redir ... permanent'"
          if grep -q 'respond "301' remnanode-setup.sh; then
            fail "на :80 остался respond-заглушка вместо редиректа"
          fi

          # 3. acme.sh должен освобождать :80 и поднимать Caddy обратно, в том числе при продлении.
          grep -qF -- '--pre-hook "$ACME_PRE_HOOK"' remnanode-setup.sh || fail "acme.sh без --pre-hook"
          grep -qF -- '--post-hook "$ACME_POST_HOOK"' remnanode-setup.sh || fail "acme.sh без --post-hook"

          # 4. SECRET_KEY вводится только маскирующим ask_secret и не попадает в лог.
          grep -q 'ask_secret SECRET_RAW' remnanode-setup.sh || fail "SECRET_KEY вводится не через ask_secret"
          if grep -q 'ask SECRET_RAW' remnanode-setup.sh; then
            fail "SECRET_KEY спрашивается обычным ask (значение попадёт в лог)"
          fi
          grep -q 'note "(auto) $__prompt = <скрыто' remnanode-setup.sh || fail "в ask_secret нет маскирования"

          # 5. Ожидание слушателей не должно ссылаться на порт, который никто не открывает.
          if grep -q 'has_tcp_listener_at 127.0.0.1 10445' remnanode-setup.sh; then
            fail "ожидание порта 10445, который больше никто не слушает"
          fi

          # 6. HTTP-слой фиксируется в конфиге и проверяется после установки.
          grep -q 'protocols tls1.2 tls1.3' remnanode-setup.sh \
            || fail "TLS 1.2/1.3 не зафиксированы в генерируемом Caddyfile"
          grep -q '^verify_http_layer() {' remnanode-setup.sh || fail "нет проверки HTTP-слоя"
          grep -q '^verify_http_layer$' remnanode-setup.sh || fail "проверка HTTP-слоя не вызывается"

          # 7. Панель может быть и по IPv6: правило ufw обязано появиться и быть проверенным.
          grep -q 'is_ipv4 "$PANEL_IP" || is_ipv6 "$PANEL_IP"' remnanode-setup.sh \
            || fail "IP панели принимается только как IPv4, без IPv6"
          grep -q 'ufw show added' remnanode-setup.sh \
            || fail "правило ufw для панели не проверяется (нет сверки ufw show added)"

          echo "✔ инварианты P0 на месте"

          # Проверки багов среднего приоритета (P2): те же правила — регресс
          # должен ломать CI, а не сервер.

          # 8. Установочный лог содержит адреса инфраструктуры и обязан быть 0600.
          grep -qF '( umask 077; : > "$LOG_FILE" )' remnanode-setup.sh \
            || fail "установочный лог не создаётся с правами 0600"

          # 9. Повторный запуск не «пропускает» выпуск битого/просроченного сертификата.
          grep -q '^acme_cert_days_left() {' remnanode-setup.sh \
            || fail "нет проверки срока действия существующего сертификата"
          grep -qF 'issue_args+=(--force)' remnanode-setup.sh \
            || fail "нет форс-перевыпуска невалидного сертификата"

          # 10. Занятый 443/tcp диагностируется до многоминутной сборки Caddy.
          grep -q 'Порт 443/tcp занят' remnanode-setup.sh \
            || fail "занятый 443/tcp не диагностируется заранее"

          # 11. Кэш сборки Go не остаётся на диске после xcaddy build.
          grep -qF 'clean -cache' remnanode-setup.sh \
            || fail "кэш сборки Go не очищается после сборки"

          # 12. Только один экземпляр установщика может работать одновременно.
          grep -qF 'flock -n' remnanode-setup.sh || fail "нет flock от параллельного запуска"

          # 13. Сертификаты внутри контейнера перечисляются busybox-совместимо:
          #     в образе ноды нет GNU find и его -printf.
          grep -qF 'files=$(ls -1 /etc/remna-certs' remnanode-setup.sh \
            || fail "просмотр сертификатов в контейнере не busybox-совместим"
          if grep -q 'find /etc/remna-certs.*-printf' remnanode-setup.sh; then
            fail "в контейнере используется GNU find -printf, которого нет в busybox"
          fi

          # 14. Валидаторы покрыты юнит-тестом: он обязан падать на старых багах
          #     (висячие двоеточия в is_ipv6, punycode TLD в is_fqdn).
          bash tests/installer-funcs-checks.sh >/dev/null \
            || fail "tests/installer-funcs-checks.sh не прошёл"

          echo "✔ инварианты P2 на месте"

          # Проверки находок уровня P3 (надёжность и полировка).

          # 15. .env ноды принудительно приводится к 0600: перезапись через
          #     redirection не меняет права файла, созданного старой версией.
          grep -qF 'chmod 600 "$NODE_DIR/.env"' remnanode-setup.sh \
            || fail ".env ноды не приводится к 0600 при повторном запуске"

          # 16. Подхват переменных в .bashrc ищется фиксированной строкой (-F),
          #     а не как regex, и записывается с кавычками.
          grep -qF 'grep -qF "source $ENV_STORE"' remnanode-setup.sh \
            || fail "поиск строки в .bashrc не использует фиксированные строки (-F)"

          # 17. Отсутствие dig — явное предупреждение, а не ложное «нет A-записи».
          grep -q 'dig не установлен' remnanode-setup.sh \
            || fail "пропуск проверки DNS без dig не предупреждается явно"

          # 18. Приватный адрес сервера (NAT/CGNAT) предупреждается.
          grep -q '^is_private_ipv4() {' remnanode-setup.sh \
            || fail "нет is_private_ipv4 для предупреждения о приватном IP сервера"

          # 19. PANEL_IP, совпадающий с адресом самого сервера, предупреждается.
          grep -qF 'совпадает с адресом самого сервера' remnanode-setup.sh \
            || fail "совпадение PANEL_IP с адресом сервера не предупреждается"

          # 20. docker compose up запускается с повторами: транзиентный сбой
          #     dockerd не должен ронять установку.
          grep -qF 'retry 3 10 docker compose up -d' remnanode-setup.sh \
            || fail "docker compose up запускается без повторов"

          # 21. Задание автопродления acme.sh проверяется в crontab и чинится,
          #     иначе сертификаты протухли бы молча через ~90 дней.
          grep -qF -- '--install-cronjob' remnanode-setup.sh \
            || fail "отсутствующее задание автопродления в crontab не восстанавливается"
          grep -qF 'acme.sh --cron' remnanode-setup.sh \
            || fail "crontab с заданием автопродления не проверяется"

          # 22. --no-reset-firewall описан в usage().
          grep -qF '  --no-reset-firewall   не сбрасывать' remnanode-setup.sh \
            || fail "--no-reset-firewall не описан в usage()"

          echo "✔ инварианты P3 на месте"

          # Проверки находок уровня P4 (полировка).

          # 23. Разбор срока действия сертификата не зависит от локали сервера:
          #     notAfter всегда на английских месяцах.
          grep -qF 'LC_ALL=C date -d' remnanode-setup.sh \
            || fail "разбор notAfter зависит от локали (нет LC_ALL=C)"

          # 24. usage() документирует NODE_DIR/CERT_DIR/ENV_STORE — как README.
          grep -qF 'NODE_DIR, CERT_DIR, ENV_STORE' remnanode-setup.sh \
            || fail "usage() не документирует NODE_DIR/CERT_DIR/ENV_STORE"

          # 25. README и usage() описывают одинаковый набор флагов.
          grep -qF -- '--no-reset-firewall   не сбрасывать' README.md \
            || fail "README не описывает флаг --no-reset-firewall"

          # 26. Минимум ОС из документации (Debian 11 / Ubuntu 20.04)
          #     проверяется установщиком с предупреждением.
          grep -qF 'dpkg --compare-versions' remnanode-setup.sh \
            || fail "минимум версии ОС из документации не проверяется"

          echo "✔ инварианты P4 на месте"

          # Проверки режима Cloudflare (автоматические A-записи).

          # 27. Записи создаются только в режиме DNS-only: proxied=false,
          #     иначе оранжевое облако сломает REALITY и прямой Hysteria2.
          grep -qF '"proxied":false' remnanode-setup.sh \
            || fail "записи Cloudflare без proxied:false (не DNS-only)"

          # 28. Токен не попадает в argv curl и в лог: curl читает его
          #     из временного файла 0600 через -K.
          grep -qF -- '-K "$CF_CURL_CFG"' remnanode-setup.sh \
            || fail "токен Cloudflare передаётся не через -K (виден в ps)"

          # 29. Генератор случайных хостов и точка входа на месте
          #     (генератор покрыт tests/installer-funcs-checks.sh).
          grep -q '^cf_make_hosts() {' remnanode-setup.sh || fail "нет cf_make_hosts"
          grep -q '^cf_setup_hosts() {' remnanode-setup.sh || fail "нет cf_setup_hosts"

          # 30. Повторный запуск без токена не затирает случайные хосты,
          #     созданные когда-то в режиме Cloudflare.
          grep -qF 'cf_valid_saved_host "${VLESS_HOST:-}"' remnanode-setup.sh \
            || fail "сохранённые хосты не переиспользуются при запуске без токена"

          # 31. usage() и README описывают Cloudflare-режим.
          grep -qF 'создать A-записи через Cloudflare API' remnanode-setup.sh \
            || fail "usage() не описывает --cloudflare"
          grep -qF 'CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE' remnanode-setup.sh \
            || fail "usage() не описывает переменные Cloudflare"
          grep -qF 'Cloudflare: создание поддоменов автоматически' README.md \
            || fail "в README нет раздела про Cloudflare"

          echo "✔ инварианты Cloudflare на месте"

          # Проверки Config Profile (Multiselect.json): профиль обязан
          # сохраняться, а его состав — совпадать с режимом XHTTP.

          # 32. Установщик сохраняет готовый профиль (панель отдаёт именно его
          #     ноде) и убирает из него inbound XHTTP, когда тот выключен:
          #     иначе профиль и Caddyfile разошлись бы и нода слушала бы 10444.
          grep -q '^multiselect_filter() {' remnanode-setup.sh \
            || fail "нет multiselect_filter (адаптация шаблона профиля)"
          grep -q '^write_config_profile() {' remnanode-setup.sh \
            || fail "нет write_config_profile (сохранение профиля)"
          # Вырезание REALITY_XHTTP при выключенном XHTTP живёт внутри jq-фильтра
          # multiselect_filter; что оно работает, проверяет юнит-тест ниже
          # (ENABLE_XHTTP=0 → в профиле только REALITY_VISION и HYSTERIA2).
          grep -qF 'startswith("VLESS_CDN_")' remnanode-setup.sh \
            || fail "jq-фильтр профиля не отличает CDN-инбаунды от REALITY_XHTTP"
          grep -qF 'out="$NODE_DIR/Multiselect.json"' remnanode-setup.sh \
            || fail "Config Profile не сохраняется в NODE_DIR"

          # 33. В режиме без XHTTP не генерируется и L4-маршрут на 10444.
          grep -qF '$XHTTP_L4_BLOCK' remnanode-setup.sh \
            || fail "в Caddyfile нет условной подстановки L4-маршрута XHTTP (переменная не используется)"
          grep -qF 'XHTTP_SNI, XHTTP_PATH, ENABLE_XHTTP,' remnanode-setup.sh \
            || fail "usage() не документирует ENABLE_XHTTP"
          grep -qF 'отключает XHTTP в selfsteal' README.md \
            || fail "README не описывает отключение XHTTP в selfsteal"

          # 34. Проверки профиля покрыты юнит-тестами: шаблон берётся из
          #     репозитория, поэтому переименование tag'а сломает CI, а не
          #     установку на сервере пользователя.
          grep -qF 'multiselect_filter cdn_transport_enabled write_config_profile' tests/installer-funcs-checks.sh \
            || fail "multiselect_filter не покрыт tests/installer-funcs-checks.sh"
          bash tests/installer-funcs-checks.sh >/dev/null \
            || fail "tests/installer-funcs-checks.sh не прошёл после правок профиля"

          echo "✔ инварианты Config Profile на месте"

          # Проверки тем фасада self-steal.

          # 35. Список тем в установщике обязан совпадать с файлами в репозитории:
          #     иначе --self-steal-template NAME приведёт к 404 на ноде.
          themes_setup="$(sed -n '/^SELF_STEAL_TEMPLATES=(/p' remnanode-setup.sh \
            | sed 's/^SELF_STEAL_TEMPLATES=(//; s/).*//' | tr ' ' '\n' | sed '/^$/d' | sort)"
          themes_files="$(ls self-steal-templates/*.html | xargs -n1 basename | sed 's/\.html$//' | sort)"
          [[ "$themes_setup" == "$themes_files" ]] \
            || fail "темы в установщике не совпадают с файлами: [$(echo "$themes_setup" | tr '\n' ' ')] vs [$(echo "$themes_files" | tr '\n' ' ')]"

          # 36. Каждая тема автономна: без внешних ресурсов (CSP ставит
          #     default-src 'none'), с noindex и инлайновым скриптом.
          for f in self-steal-templates/*.html; do
            grep -qF '<meta name="robots" content="noindex, nofollow">' "$f" \
              || fail "$f: нет noindex, nofollow"
            grep -q '<script>' "$f" || fail "$f: нет инлайнового скрипта"
            if grep -qE '(src|href)="https?://' "$f" || grep -qE '@import|url\(https?://' "$f"; then
              fail "$f: ссылка на внешний ресурс — CSP её всё равно заблокирует"
            fi
          done

          # 37. Флаг и переменная описаны в usage() и README.
          grep -qF -- '--self-steal-template T' remnanode-setup.sh \
            || fail "usage() не описывает --self-steal-template"
          grep -qF 'SELF_STEAL_TEMPLATE, SELF_STEAL_TEMPLATE_URL' remnanode-setup.sh \
            || fail "usage() не описывает SELF_STEAL_TEMPLATE"
          grep -qF 'Фасад self-steal: темы' README.md \
            || fail "README не описывает темы фасада self-steal"

          echo "✔ инварианты тем self-steal на месте"

          # Проверки VLESS за CDN: протокол живёт в установщике, профиле,
          # тестах и README — разъехавшиеся части ломают установку на сервере.

          # 38. usage() документирует CDN-переменные — как README.
          grep -qF 'ENABLE_CDN, CDN_HOST, CDN_TRANSPORT' remnanode-setup.sh \
            || fail "usage() не документирует ENABLE_CDN/CDN_*"
          grep -qF 'ENABLE_CDN`, `CDN_HOST`, `CDN_TRANSPORT`' README.md \
            || fail "README не описывает переменные CDN"

          # 39. README описывает сам протокол и работу с панелью.
          grep -qF '## VLESS за CDN (Cloudflare)' README.md \
            || fail "в README нет раздела про VLESS за CDN"
          grep -qF '#vless-за-cdn-cloudflare' README.md \
            || fail "в README нет ссылок на раздел про VLESS за CDN"
          grep -qF 'Security layer' README.md \
            || fail "README не объясняет Security layer TLS для CDN-хоста"

          # 40. CDN-инбаунды есть в профиле, а их состав и пути покрыты тестами.
          grep -qF '"tag": "VLESS_CDN_WS"' Multiselect.json \
            || fail "в Multiselect.json нет CDN-инбаунда VLESS_CDN_WS"
          grep -qF 'VLESS_CDN' tests/caddy-http-checks.sh \
            || fail "CDN-маршруты Caddy не покрыты tests/caddy-http-checks.sh"
          bash tests/installer-funcs-checks.sh >/dev/null \
            || fail "tests/installer-funcs-checks.sh не прошёл после правок CDN"

          echo "✔ инварианты VLESS за CDN на месте"

          # Проверки разбора переменных окружения и идемпотентности повторного
          # запуска: регресс здесь молча меняет схему на уже работающей ноде.

          # 41. Логические флаги нормализуются, а не сравниваются с префиксом «y»:
          #     значение 1 (его писал в env-файл установщик прежних версий)
          #     выключало CDN, а ответ «n» для XHTTP не сохранялся вовсе.
          grep -q 'ask_bool ENABLE_XHTTP' remnanode-setup.sh \
            || fail "ENABLE_XHTTP разбирается не через ask_bool (значение 1 выключит XHTTP)"
          grep -q 'ask_bool ENABLE_CDN' remnanode-setup.sh \
            || fail "ENABLE_CDN разбирается не через ask_bool (значение 1 выключит CDN)"
          if grep -qE 'ENABLE_(CDN|XHTTP),,\}" (!= |== )y' remnanode-setup.sh; then
            fail "флаги сравниваются с префиксом «y»: значения 1/yes/on будут поняты неверно"
          fi
          grep -q 'printf .export ENABLE_XHTTP=%s' remnanode-setup.sh \
            || fail "решение по XHTTP не сохраняется в env-файл (повторный запуск включит XHTTP обратно)"
          grep -q 'printf .export ENABLE_CDN=%s' remnanode-setup.sh \
            || fail "решение по CDN не сохраняется в env-файл"
          bash tests/env-flags-checks.sh >/dev/null \
            || fail "tests/env-flags-checks.sh не прошёл"

          # 42. SERVER_IP из env имеет приоритет над автодетектом: за NAT
          #     внешние сервисы недоступны, а README и текст ошибки советуют
          #     задать адрес переменной.
          if grep -q '^SERVER_IP=""$' remnanode-setup.sh; then
            fail "SERVER_IP из env затирается автодетектом"
          fi
          grep -qF '(SERVER_IP из env)' remnanode-setup.sh \
            || fail "SERVER_IP из env не используется как приоритетное значение"
          grep -q 'SERVER_IP, NODE_DIR, CERT_DIR, ENV_STORE' remnanode-setup.sh \
            || fail "usage() не документирует SERVER_IP"

          # 43. Порт ноды не может занять порт CDN-сайта или CDN-инбаунда.
          grep -qF '"$CDN_TLS_PORT"|"$CDN_WS_PORT"|"$CDN_XHTTP_PORT"|"$CDN_GRPC_PORT")' \
            remnanode-setup.sh \
            || fail "NODE_API_PORT не проверяется на конфликт с CDN-портами"

          # 44. apt_wait не полагается на fuser, который ставится позже (шаг 3).
          grep -q 'have fuser || return 0' remnanode-setup.sh \
            || fail "apt_wait использует fuser без проверки (ожидание dpkg-lock не работает)"

          # 45. Версии сборки не разъехались: Caddy >= 2.11.6 требует для сборки
          #     Go >= 1.26 (release notes v2.11.6), а caddy-l4 v0.1.2 объявляет
          #     минимум Caddy v2.11.4 — то есть пины обязаны быть согласованы.
          caddy_ver="$(sed -n 's/^CADDY_VERSION="\${CADDY_VERSION:-\(v[0-9.]*\)}".*/\1/p' remnanode-setup.sh)"
          go_ver="$(sed -n 's/^GO_VERSION="\([0-9.]*\)".*/\1/p' remnanode-setup.sh)"
          [[ -n "$caddy_ver" && -n "$go_ver" ]] \
            || fail "не удалось прочитать CADDY_VERSION/GO_VERSION из установщика"
          if [[ "$(printf '%s\n%s\n' v2.11.6 "$caddy_ver" | sort -V | head -1)" == v2.11.6 ]] \
             && [[ "$(printf '%s\n%s\n' 1.26 "$go_ver" | sort -V | head -1)" != 1.26 ]]; then
            fail "Caddy $caddy_ver требует для сборки Go >= 1.26, а пин — Go $go_ver"
          fi

          # 46. Чистка за собой: после установки на диске не остаются инструменты
          #     сборки Caddy, build-essential (если его поставил установщик) и apt-архивы.
          grep -q '^remove_build_leftovers() {' remnanode-setup.sh \
            || fail "нет очистки инструментов сборки (Go, xcaddy, кэши)"
          grep -q '^remove_build_packages() {' remnanode-setup.sh \
            || fail "нет удаления build-essential после сборки"
          grep -q '^cleanup_system_leftovers() {' remnanode-setup.sh \
            || fail "нет финальной очистки apt и Docker"
          grep -q '^cleanup_system_leftovers$' remnanode-setup.sh \
            || fail "финальная очистка не вызывается"
          grep -qF 'apt_get clean' remnanode-setup.sh \
            || fail "архивы .deb (apt) не очищаются"
          grep -q 'remove_build_leftovers >/dev/null' remnanode-setup.sh \
            || fail "очистка сборки не вызывается при сбое (on_exit)"
          grep -qF 'BUILD_ESSENTIAL_ADDED=1' remnanode-setup.sh \
            || fail "build-essential может быть удалён, хотя был в системе до установки"
          grep -qF -- '--keep-build-tools' remnanode-setup.sh \
            || fail "нет флага --keep-build-tools для сохранения инструментов сборки"

          echo "✔ инварианты переменных окружения на месте"
